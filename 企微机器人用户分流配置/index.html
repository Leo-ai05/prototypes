function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function toast(msg, type, linkText, linkFn) {
  var box = $("toastBox");
  var el = document.createElement("div");
  el.className = "toast " + (type || "");
  el.innerHTML = esc(msg);
  if (linkText) {
    var a = document.createElement("span");
    a.className = "tlink"; a.textContent = linkText;
    a.onclick = function () { el.remove(); linkFn && linkFn(); };
    el.appendChild(a);
  }
  box.appendChild(el);
  setTimeout(function () { el.remove(); }, linkText ? 6000 : 2600);
}

      "</div>" +
    "</div>"
  );
}

}
function findRuleGroup(id) {
  for (var i = 0; i < ruleGroups.length; i++) if (ruleGroups[i].id === id) return ruleGroups[i];
  return null;
}
function condSummary(g) {
  if (g.fallback) return "";
  if (g.condCount < 2) return g.condCount + " 个条件组";
  return g.condCount + " 个条件组（组间" + (g.conj === "or" ? "或" : "且") + "）";
}
function condText(cond) {
  if (!cond) return "—";
  var parts = [];
  cond.groups.forEach(function (sub) {
    var inner = sub.conds.map(function (c) { return c[0] + " " + c[1] + " " + c[2]; }).join(sub.conj === "or" ? " 或 " : " 且 ");
    parts.push(cond.groups.length > 1 ? "（" + inner + "）" : inner);
  });
  return parts.join(cond.conj === "or" ? " 或 " : " 且 ");
}

/* =======================================================================
   页面路由
   ======================================================================= */
function go(page, arg) {
  ["pageSplit", "pageRule", "pageDetail"].forEach(function (id) { $(id).classList.add("hide"); });
  $("navRule").classList.remove("active");
  $("navSplit").classList.remove("active");

  if (page === "split") {
    $("navSplit").classList.add("active");
    $("crumb").innerHTML = '企业微信机器人 / <b>分流配置</b>';
    draft = JSON.parse(JSON.stringify(splitGroups));
    renderSplit();
    $("pageSplit").classList.remove("hide");
  } else if (page === "rule") {
    $("navRule").classList.add("active");
    $("crumb").innerHTML = '企业微信机器人 / <b>规则配置</b>';
    if (arg !== undefined) filterSplitId = arg;
    renderRule();
    $("pageRule").classList.remove("hide");
  } else {
    $("navRule").classList.add("active");
    currentGroupId = arg;
    var g = findRuleGroup(arg);
    $("crumb").innerHTML = '企业微信机器人 / <span class="link" onclick="go(\'rule\')">规则配置</span> / <b>' + esc(g.name) + "</b>";
    renderDetail();
    $("pageDetail").classList.remove("hide");
  }
  window.scrollTo(0, 0);
}

/* =======================================================================
   页面一：分流配置
   ======================================================================= */
function ratioSum() {
  var s = 0;
  draft.forEach(function (g) { s += Number(g.ratio) || 0; });
  return s;
}
function controlCount() {
  return draft.filter(function (g) { return g.type === "control"; }).length;
}
/** 分流总开关能否操作，返回 null 表示可用，否则返回置灰原因 */
function switchBlockReason() {
  if (draft.length < 2) return "至少配置 2 个分流组才能开启分流";
  if (ratioSum() !== 100) return "流量比例合计需等于 100% 才能开启分流";
  return null;
}
function totalAssigned() {
  var s = 0;
  splitGroups.forEach(function (g) { s += g.users; });
  return s;
}

function renderSplit() {
  var sum = ratioSum();
  var blockReason = switchBlockReason();
  var total = totalAssigned();

  var rowsHtml = "";
  if (draft.length === 0) {
    rowsHtml =
      '<tr><td colspan="8"><div class="empty">暂无分流组，请先新增对照组与实验组<div class="mt12">' +
      '<button class="btn primary" onclick="openGroupDialog(null)">新增分流组</button></div></div></td></tr>';
  } else {
    var sorted = draft.slice().sort(function (a, b) {
      if (a.type === "control") return -1;
      if (b.type === "control") return 1;
      return b.ratio - a.ratio;
    });
    sorted.forEach(function (g) {
      var live = null;
      for (var i = 0; i < splitGroups.length; i++) if (splitGroups[i].id === g.id) live = splitGroups[i];
      var users = live ? live.users : 0;
      var pct = total > 0 && live ? ((users / total) * 100).toFixed(1) + "%" : "—";
      var relCount = g.id ? ruleGroupsOf(g.id).length : 0;

      // 删除置灰判定
      var delReason = null;
      if (g.type === "control") delReason = "对照组不可删除";
      else if (users > 0) delReason = "该分流组已有 " + users + " 个用户分配，不可删除";
      else if (relCount > 0) delReason = "请先把该分流组下的 " + relCount + " 个规则分组改到其他分流组";

      rowsHtml +=
        "<tr>" +
          "<td><b>" + esc(g.name) + "</b>" + (g.type === "control" ? ' <span class="tag blue">对照组</span>' : "") +
            (g.desc ? '<div class="small muted mt8">' + esc(g.desc) + "</div>" : "") + "</td>" +
          "<td>" + (g.type === "control" ? '<span class="tag blue">对照组</span>' : '<span class="tag gray">实验组</span>') + "</td>" +
          "<td><b>" + g.ratio + "%</b></td>" +
          "<td>" + users + "</td>" +
          "<td>" + pct + "</td>" +
          "<td>" + (relCount > 0
              ? '<span class="link" onclick="go(\'rule\',' + g.id + ')">' + relCount + "</span>"
              : "0") + "</td>" +
          "<td class=\"muted small\">" + esc(g.updated) + "</td>" +
          "<td>" +
            '<button class="link" onclick="openGroupDialog(' + g.id + ')">编辑</button>' +
            (delReason
              ? '<span class="tip"><button class="link" disabled>删除</button><span class="tip-text">' + esc(delReason) + "</span></span>"
              : '<button class="link" style="color:#f56c6c" onclick="askDeleteGroup(' + g.id + ')">删除</button>') +
          "</td>" +
        "</tr>";
    });
  }

  var addBlocked = draft.length >= 5;

  $("pageSplit").innerHTML =
    // ---------- 分流总开关 ----------
    '<div class="card">' +
      '<div class="sec-head"><div class="sec-bar"></div><div class="sec-title">分流总开关</div></div>' +
      '<div class="row mb12">' +
        '<span>启用用户分流</span>' +
        (blockReason
          ? '<span class="tip"><span class="switch disabled' + (splitOn ? " on" : "") + '"></span>' +
            '<span class="tip-text">' + esc(blockReason) + "</span></span>"
          : '<span class="switch' + (splitOn ? " on" : "") + '" onclick="askToggleSplit()"></span>') +
        '<span class="' + (splitOn ? "tag green" : "tag gray") + '">' + (splitOn ? "分流生效中" : "分流未生效") + "</span>" +
        '<span class="muted small">' +
          (splitOn ? "分流生效中，新增用户按下方比例分配" : "分流未生效，所有用户按对照组执行") +
        "</span>" +
      "</div>" +
      '<div class="alert gray">关闭时所有用户按对照组名下的规则分组执行，兜底分组照常生效。开关开启前已存在的用户固定按对照组执行。</div>' +
    "</div>" +

    // ---------- 分流组列表 ----------
    '<div class="card">' +
      '<div class="sec-head"><div class="sec-bar"></div><div class="sec-title">分流组</div>' +
        '<span class="muted small" style="margin-left:12px">最多 5 个，其中有且仅有一个对照组</span></div>' +
      '<div class="row mb16">' +
        (addBlocked
          ? '<span class="tip"><button class="btn primary" disabled>+ 新增分流组</button><span class="tip-text">最多配置 5 个分流组</span></span>'
          : '<button class="btn primary" onclick="openGroupDialog(null)">+ 新增分流组</button>') +
        '<span class="' + (sum === 100 ? "tag green" : "tag red") + '">流量比例合计 ' + sum + "%</span>" +
        (sum !== 100 ? '<span class="muted small">合计需等于 100% 才能保存并开启分流</span>' : "") +
      "</div>" +
      "<table><thead><tr>" +
        "<th>分流组名称</th><th>分流组类型</th><th>流量比例</th><th>已分配用户数</th>" +
        "<th>实际占比</th><th>关联规则分组数</th><th>更新时间</th><th style=\"width:130px\">操作</th>" +
      "</tr></thead><tbody>" + rowsHtml + "</tbody></table>" +
      '<div class="hint mt12">修改比例只影响后续新增用户，已分配用户归属不变。</div>' +
      '<div class="mt16"><button class="btn primary" onclick="saveSplit()">保存配置</button>' +
        '<span class="muted small" style="margin-left:10px">新增、编辑、删除后需点击保存配置才生效</span></div>' +
    "</div>";
}

      "开启后新增用户将按流量比例分配分流组，分配结果不可修改。<br>开启前已存在的用户固定按对照组执行。",

/* ---------- 分流组编辑弹窗 ---------- */

      '<div class="dlg-body">' +
        '<div class="form-item"><div class="form-label"><span class="req">*</span>分流组名称</div><div class="form-ctl">' +

            '<label class="radio"><input type="radio" name="gType" value="exp" ' +

          "</div>" +

        "</div></div>" +

        '<div class="form-item"><div class="form-label"><span class="req">*</span>流量比例</div><div class="form-ctl">' +
          '<input type="number" id="gRatio" min="1" max="100" style="width:120px" placeholder="请输入" value="' +
            (g ? g.ratio : "") + '" oninput="onGroupInput()" /> <span class="muted">%</span>' +

        "</div></div>" +

          '<textarea id="gDesc" rows="3" maxlength="100" style="width:100%" placeholder="说明该分流组要验证什么" ' +
            'oninput="onGroupInput()">' + (g ? esc(g.desc || "") : "") + "</textarea>" +
          '<div class="hint"><span id="gDescLen">' + (g && g.desc ? g.desc.length : 0) + "</span>/100</div>" +
        "</div></div>" +
      "</div>" +
      '<div class="dlg-foot">' +
        '<button class="btn" onclick="tryCloseGroupDialog()">取消</button>' +
        '<span class="tip" id="gOkWrap"><button class="btn primary" id="gOk" onclick="submitGroupDialog()">确定</button>' +
          '<span class="tip-text" id="gOkTip">请先填写分流组名称与流量比例</span></span>' +
      "</div>" +
    "</div>"
  );
  window.__editingGroupId = id;
  window.__groupDirty = false;
  onGroupInput(true);
}

function onTypePick() {
  var picked = document.querySelector('input[name=gType]:checked').value;
  if (picked === "control") {
    var other = draft.filter(function (g) { return g.type === "control" && g.id !== window.__editingGroupId; });
    if (other.length > 0) {
      toast("已存在对照组，请先把原对照组改为实验组", "warn");
      document.querySelector('input[name=gType][value=exp]').checked = true;
    }
  }
  onGroupInput();
}

function onGroupInput(init) {
  if (!init) window.__groupDirty = true;
  var name = $("gName").value.trim();
  var ratio = $("gRatio").value;
  $("gNameLen").textContent = name.length;
  $("gDescLen").textContent = $("gDesc").value.length;

  // 名称重复校验
  var dup = draft.filter(function (g) { return g.name === name && g.id !== window.__editingGroupId; }).length > 0;
  $("gNameErr").classList.toggle("hide", !(dup && name));

  // 比例合法性
  var num = Number(ratio);
  var ratioBad = ratio !== "" && (!Number.isInteger(num) || num < 1 || num > 100);
  $("gRatioErr").classList.toggle("hide", !ratioBad);

  // 合计提示
  var others = 0;
  draft.forEach(function (g) { if (g.id !== window.__editingGroupId) others += Number(g.ratio) || 0; });
  var sum = others + (num || 0);
  $("gRatioHint").innerHTML =
    "当前所有分流组比例合计 <b style=\"color:" + (sum === 100 ? "#67c23a" : "#f56c6c") + '">' + sum + "%</b>";

  // 确定按钮启用条件
  var ok = name && ratio !== "" && !dup && !ratioBad;
  $("gOk").disabled = !ok;
  $("gOkTip").classList.toggle("hide", !!ok);
  if (ok) $("gOkTip").style.display = "none"; else $("gOkTip").style.display = "";
}

function tryCloseGroupDialog() {
  if (window.__groupDirty) {
    var reopen = window.__editingGroupId;
    confirmBox("提示", "当前修改尚未保存，确认放弃？", "确认放弃", function () { closeDialog(); }, "danger");
    return;
  }
  closeDialog();
}

function submitGroupDialog() {
  var name = $("gName").value.trim();
  var type = document.querySelector('input[name=gType]:checked').value;
  var ratio = Number($("gRatio").value);
  var desc = $("gDesc").value.trim();
  var id = window.__editingGroupId;

  if (id === null || id === undefined) {
    var newId = 100;
    draft.forEach(function (g) { if (g.id >= newId) newId = g.id + 1; });
    draft.push({ id: newId, name: name, type: type, ratio: ratio, users: 0, desc: desc, updated: "待保存" });
  } else {
    for (var i = 0; i < draft.length; i++) {
      if (draft[i].id === id) {
        draft[i].name = name; draft[i].type = type; draft[i].ratio = ratio;
        draft[i].desc = desc; draft[i].updated = "待保存";
      }
    }
  }
  closeDialog();
  renderSplit();
  toast("已添加到列表，请点击保存配置生效", "info");
}

/* ---------- 删除分流组 ---------- */
function askDeleteGroup(id) {
  confirmBox("删除分流组", "删除后该分流组不再参与分流，确认删除？", "确认删除", function () {
    draft = draft.filter(function (g) { return g.id !== id; });
    renderSplit();
    if (draft.length < 2 && splitOn) {
      splitOn = false;
      renderSplit();
      toast("分流组不足 2 个，分流已不可开启", "warn");
    } else {
      toast("已从列表移除，请点击保存配置生效", "info");
    }
  }, "danger");
}

/* ---------- 保存配置 ---------- */
function saveSplit() {
  if (draft.length < 2) { toast("至少配置 2 个分流组", "err"); return; }
  var ctrl = controlCount();
  if (ctrl !== 1) { toast("有且仅有一个分流组可标记为对照组", "err"); return; }
  var sum = ratioSum();
  if (sum !== 100) { toast("流量比例合计需等于 100%，当前为 " + sum + "%", "err"); return; }
  var names = {};
  for (var i = 0; i < draft.length; i++) {
    if (names[draft[i].name]) { toast("分流组名称不可重复", "err"); return; }
    names[draft[i].name] = 1;
  }

  splitGroups = draft.map(function (g) {
    var live = null;
    for (var j = 0; j < splitGroups.length; j++) if (splitGroups[j].id === g.id) live = splitGroups[j];
    return {
      id: g.id, name: g.name, type: g.type, ratio: g.ratio,
      users: live ? live.users : 0, desc: g.desc, updated: "2026-08-24 16:20"
    };
  });
  // 分流组被删除时，其名下规则分组同步清理（原型内简化处理）
  var ids = splitGroups.map(function (g) { return g.id; });
  ruleGroups = ruleGroups.filter(function (g) { return g.fallback || ids.indexOf(g.splitId) >= 0; });

  draft = JSON.parse(JSON.stringify(splitGroups));
  renderSplit();
  toast("保存成功");
}

  var emptyTip = (filterSplitId !== "all" && normalCount === 0)

  $("pageRule").innerHTML =
    '<div class="card">' +
      '<div class="row mb16">' +
        "<span>所属分流组</span>" +
        '<select style="width:220px" onchange="go(\'rule\', this.value)">' + opts + "</select>" +
        '<span class="muted small">兜底分组在任意筛选下都展示</span>' +
        '<span style="flex:1"></span>' +
        '<button class="btn primary" onclick="openRuleGroupDialog(null)">+ 新建分组</button>' +
      "</div>" +
      emptyTip +
      "<table><thead><tr>" +
        "<th>分组名称</th><th>所属分流组</th><th>命中条件</th><th>规则数</th>" +
        "<th>更新时间</th><th>启用状态</th><th style=\"width:200px\">操作</th>" +
      "</tr></thead><tbody>" + rowsHtml + "</tbody></table>" +
    "</div>";
}

/* ---------- 新建 / 编辑规则分组弹窗 ---------- */

      '<div class="dlg-body">' +
        '<div class="form-item"><div class="form-label"><span class="req">*</span>所属分流组</div><div class="form-ctl">' +

            : '<div class="hint" id="rgSplitHint"></div>') +
        "</div></div>" +

        '<div class="form-item"><div class="form-label"><span class="req">*</span>分组名称</div><div class="form-ctl">' +
          '<input type="text" id="rgName" maxlength="30" style="width:100%" placeholder="请输入分组名称" value="' +
            (g ? esc(g.name) : "") + '" />' +
        "</div></div>" +

        '<div class="form-item"><div class="form-label">分组描述</div><div class="form-ctl">' +
          '<textarea rows="2" maxlength="200" style="width:100%" placeholder="请输入分组描述"></textarea>' +
        "</div></div>" +

        (isFallback ? "" :
        '<div class="form-item"><div class="form-label">命中条件</div><div class="form-ctl">' +
          '<div class="cond-wrap">' + condEditorHtml(g ? groupConds[g.id] : null) + "</div>" +
          '<div class="hint" id="rgCondHint"></div>' +
        "</div></div>") +
      "</div>" +
      '<div class="dlg-foot">' +
        '<button class="btn" onclick="closeDialog()">取消</button>' +
        '<button class="btn primary" onclick="submitRuleGroup(' + (isNew ? "null" : id) + ')">确定</button>' +
      "</div>" +
    "</div>"
  );
  window.__rgOriginSplitId = isNew ? null : g.splitId;
  window.__editingRuleGroupId = id;
  renderRgCondHint();
}

function renderRgCondHint() {
  var sel = $("rgSplit");
  if (!sel) return;
  var picked = Number(sel.value);
  var origin = window.__rgOriginSplitId;

  var condEl = $("rgCondHint");
  if (condEl) condEl.innerHTML = "提交时只与「" + esc(groupName(picked)) + "」下的其他分组比对命中条件是否重复，跨分流组允许条件相同。";

  var splitEl = $("rgSplitHint");
  if (!splitEl) return;
  if (origin === null) {
    splitEl.innerHTML = "新建后仍可随时改到其他分流组。";
    splitEl.style.color = "";
  } else if (picked === origin) {
    splitEl.innerHTML = "可随时改到其他分流组，命中条件保持不变。";
    splitEl.style.color = "";
  } else {
    var n = (rules[window.__editingRuleGroupId] || []).length;
    splitEl.innerHTML = "将从「" + esc(groupName(origin)) + "」改到「" + esc(groupName(picked)) +
      "」，该分组及名下 " + n + " 条规则改为只对新分流组的用户生效。";
    splitEl.style.color = "#e6a23c";
  }
}

/** 只读风格的条件编辑区（原型内简化为可视化展示 + 可增删行的占位） */
function condEditorHtml(cond) {
  if (!cond) {
    return '<div class="cond-block"><div class="cond-row">' +
      '<select style="width:150px"><option>请选择条件字段</option><option>年级</option><option>付费状态</option><option>意向等级</option><option>加好友天数</option></select>' +
      '<select style="width:100px"><option>等于</option><option>不等于</option><option>大于</option><option>小于</option><option>包含</option></select>' +
      '<input type="text" placeholder="请输入条件值" style="width:150px" />' +
      '<button class="link">删除</button></div>' +
      '<button class="link mt8">+ 添加条件</button></div>' +
      '<button class="link">+ 添加条件分组</button>';
  }
  var html = "";
  cond.groups.forEach(function (sub, gi) {
    if (gi > 0) html += '<div class="mb8"><span class="logic">' + (cond.conj === "or" ? "或" : "且") + "</span></div>";
    html += '<div class="cond-block"><div class="small muted mb8">条件组 ' + (gi + 1) + "</div>";
    sub.conds.forEach(function (c, ci) {
      html += '<div class="cond-row">' +
        (ci > 0 ? '<span class="logic">' + (sub.conj === "or" ? "或" : "且") + "</span>" : '<span style="width:34px"></span>') +
        '<select style="width:150px"><option selected>' + esc(c[0]) + "</option></select>" +
        '<select style="width:100px"><option selected>' + esc(c[1]) + "</option></select>" +
        '<input type="text" style="width:150px" value="' + esc(c[2]) + '" />' +
        '<button class="link">删除</button></div>';
    });
    html += '<button class="link mt8">+ 添加条件</button></div>';
  });
  html += '<button class="link">+ 添加条件分组</button>';
  return html;
}

function submitRuleGroup(id) {
  var name = $("rgName").value.trim();
  if (!name) { toast("请输入分组名称", "err"); return; }
  if (id === null) {
    var sel = $("rgSplit");
    var splitId = Number(sel.value);
    // 同分流组内条件查重演示：同组内已存在同名条件摘要的分组则拦截
    var newId = 200;
    ruleGroups.forEach(function (g) { if (g.id >= newId) newId = g.id + 1; });
    ruleGroups.push({ id: newId, name: name, splitId: splitId, condCount: 1, conj: "and", ruleCount: 0, status: 0, updated: "2026-08-24 16:20" });
    rules[newId] = [];
    groupConds[newId] = { conj: "and", groups: [{ conj: "and", conds: [["年级", "等于", "初一"]] }] };
    closeDialog();
    filterSplitId = splitId;
    renderRule();
    toast("创建成功");
  } else {
    var g = findRuleGroup(id);
    var sel2 = $("rgSplit");
    var target = sel2 ? Number(sel2.value) : g.splitId;

    if (!sel2 || target === g.splitId) {
      g.name = name;
      g.updated = "2026-08-24 18:40";
      closeDialog();
      renderRule();
      toast("保存成功");
      return;
    }

    // 改归属：先在目标分流组内比对命中条件是否重复
    var mine = condText(groupConds[g.id]);
    var clash = ruleGroupsOf(target).filter(function (o) {
      return o.id !== g.id && condText(groupConds[o.id]) === mine;
    })[0];
    if (clash) {
      toast("命中条件与目标分流组的分组「" + clash.name + "」重复，请修改后再调整归属", "err");
      return;
    }

    var n = (rules[g.id] || []).length;
    confirmBox2(
      "调整所属分流组",
      "该分组及其名下 " + n + " 条规则将改为只对「" + esc(groupName(target)) +
        "」的用户生效，原分流组的用户不再执行这些规则。确认调整？",
      "确认调整",
      function () {
        g.name = name;
        g.splitId = target;
        g.updated = "2026-08-24 18:40";
        closeDialog();
        renderRule();
        toast("已调整所属分流组");
      }
    );
  }
}

/* ---------- 复制规则分组弹窗 ---------- */
function openCopyGroupDialog(id) {
  var src = findRuleGroup(id);
  var srcRules = rules[id] || [];

  var opts = "";
  splitGroups.forEach(function (s) {
    opts += '<option value="' + s.id + '"' + (s.id === src.splitId ? " selected" : "") + ">" +
      esc(s.name) + (s.type === "control" ? "（对照组）" : "") + "</option>";
  });

  var pickHtml = "";
  if (srcRules.length === 0) {
    pickHtml = '<div class="empty" style="padding:24px 0">该分组下暂无规则</div>';
  } else {
    pickHtml = '<div class="pick-head"><label class="radio"><input type="checkbox" id="pickAll" checked onchange="togglePickAll()" />' +
      "<b>全选</b><span class=\"muted small\" style=\"margin-left:8px\">共 " + srcRules.length + " 条规则</span></label></div>";
    srcRules.forEach(function (r) {
      pickHtml += '<div class="pick-item">' +
        '<input type="checkbox" class="pickRule" value="' + r.id + '" checked onchange="syncPickAll()" />' +
        '<div class="pick-name"><b>' + esc(r.name) + "</b>" +
          '<div class="small muted mt8">' + esc(r.trigger) + " · " + r.actions.map(esc).join(" / ") + "</div></div>" +
        "<div>" + (r.status ? '<span class="tag green">已启用</span>' : '<span class="tag gray">已禁用</span>') + "</div>" +
      "</div>";
    });
  }

  openDialog(
    '<div class="dialog lg">' +
      '<div class="dlg-head">复制分组<button class="dlg-close" onclick="closeDialog()">&times;</button></div>' +
      '<div class="dlg-body">' +
        '<div class="alert info mb16">复制自分组「' + esc(src.name) + "」，所属分流组「" + esc(groupName(src.splitId)) +
          "」，共 " + srcRules.length + " 条规则</div>" +

        '<div class="form-item"><div class="form-label"><span class="req">*</span>目标分流组</div><div class="form-ctl">' +
          '<select id="cgSplit" style="width:280px" onchange="onCopyTargetChange(' + id + ')">' + opts + "</select>" +
          '<div class="hint" id="cgSplitHint"></div>' +
        "</div></div>" +

        '<div class="form-item"><div class="form-label"><span class="req">*</span>分组名称</div><div class="form-ctl">' +
          '<input type="text" id="cgName" maxlength="30" style="width:100%" value="' + esc(src.name) + '-副本" />' +
        "</div></div>" +

        '<div class="form-item"><div class="form-label">分组描述</div><div class="form-ctl">' +
          '<textarea rows="2" maxlength="200" style="width:100%">' + esc(src.name) + " 的复制版本</textarea>" +
        "</div></div>" +

        '<div class="form-item"><div class="form-label"><span class="req">*</span>命中条件</div><div class="form-ctl">' +
          '<div id="cgCondArea"></div>' +
        "</div></div>" +

        '<div class="form-item"><div class="form-label">包含规则</div><div class="form-ctl">' +
          '<div class="alert gray mb8">带过去的规则统一为已禁用，需逐条确认后手动启用</div>' +
          '<div class="pick-list">' + pickHtml + "</div>" +
        "</div></div>" +
      "</div>" +
      '<div class="dlg-foot">' +
        '<button class="btn" onclick="closeDialog()">取消</button>' +
        '<button class="btn primary" onclick="submitCopyGroup(' + id + ')">确认</button>' +
      "</div>" +
    "</div>"
  );
  onCopyTargetChange(id);
}

function onCopyTargetChange(srcId) {
  var src = findRuleGroup(srcId);
  var target = Number($("cgSplit").value);
  var same = target === src.splitId;

  $("cgSplitHint").innerHTML = same
    ? "目标与来源为同一分流组，命中条件不可重复"
    : "跨分流组复制，命中条件可原样沿用来源分组";

  if (same) {
    $("cgCondArea").innerHTML =
      '<div class="alert warn mb8">同一分流组内命中条件不可重复，请重新配置</div>' +
      '<div class="cond-wrap">' + condEditorHtml(null) + "</div>";
  } else {
    $("cgCondArea").innerHTML =
      '<div class="alert info mb8">已原样带入来源分组的命中条件，可直接使用，也可修改</div>' +
      '<div class="cond-wrap">' + condEditorHtml(groupConds[srcId]) + "</div>" +
      '<div class="hint">当前条件：' + esc(condText(groupConds[srcId])) + "</div>";
  }
}

function togglePickAll() {
  var all = $("pickAll").checked;
  var list = document.querySelectorAll(".pickRule");
  for (var i = 0; i < list.length; i++) list[i].checked = all;
}
function syncPickAll() {
  var list = document.querySelectorAll(".pickRule");
  var checked = 0;
  for (var i = 0; i < list.length; i++) if (list[i].checked) checked++;
  $("pickAll").checked = checked === list.length;
}

function submitCopyGroup(srcId) {
  var src = findRuleGroup(srcId);
  var target = Number($("cgSplit").value);
  var name = $("cgName").value.trim();
  if (!name) { toast("请先填写分组名称并完成命中条件配置", "err"); return; }

  // 同分流组内命中条件查重演示
  if (target === src.splitId) {
    toast("命中条件与目标分流组的分组「" + src.name + "」重复，请修改", "err");
    return;
  }

  var picked = [];
  var list = document.querySelectorAll(".pickRule");
  for (var i = 0; i < list.length; i++) if (list[i].checked) picked.push(Number(list[i].value));

  var newId = 200;
  ruleGroups.forEach(function (g) { if (g.id >= newId) newId = g.id + 1; });
  ruleGroups.push({
    id: newId, name: name, splitId: target,
    condCount: groupConds[srcId] ? groupConds[srcId].groups.length : 1,
    conj: groupConds[srcId] ? groupConds[srcId].conj : "and",
    ruleCount: picked.length, status: src.status, updated: "2026-08-24 16:20"
  });
  groupConds[newId] = JSON.parse(JSON.stringify(groupConds[srcId] || { conj: "and", groups: [] }));

  var srcRules = rules[srcId] || [];
  rules[newId] = srcRules.filter(function (r) { return picked.indexOf(r.id) >= 0; }).map(function (r) {
    var copy = JSON.parse(JSON.stringify(r));
    copy.id = r.id + 3000;
    copy.status = 0;
    copy.updated = "2026-08-24 16:20";
    copy.operator = "朱胜武";
    return copy;
  });

  closeDialog();
  filterSplitId = target;
  renderRule();
  toast("复制成功，已带入 " + picked.length + " 条规则，均为禁用状态");
}

/* =======================================================================
   页面三：规则分组详情
   ======================================================================= */
function renderDetail() {
  var g = findRuleGroup(currentGroupId);
  var list = rules[currentGroupId] || [];

  var rowsHtml = "";
  list.forEach(function (r) {
    rowsHtml +=
      "<tr>" +
        "<td>" + r.id + "</td>" +
        "<td><b>" + esc(r.name) + "</b>" +
          (r.official ? ' <span class="tag orange">官方群发</span>' : "") + "</td>" +
        "<td>" + esc(r.trigger) + "</td>" +
        "<td>" + r.actions.map(function (a) { return '<span class="tag blue">' + esc(a) + "</span>"; }).join("") + "</td>" +
        "<td class=\"muted small\">" + esc(r.updated) + "</td>" +
        "<td class=\"muted small\">" + esc(r.operator) + "</td>" +
        "<td>" + (r.status
            ? '<span class="tag green">已启用</span>'
            : '<span class="tag gray">已禁用</span>') + "</td>" +
        "<td>" +
          '<button class="link">编辑</button>' +
          '<button class="link" onclick="openCopyRuleDialog(' + r.id + ')">复制</button>' +
          '<button class="link" style="color:#f56c6c">删除</button>' +
        "</td>" +
      "</tr>";
  });
  if (list.length === 0) rowsHtml = '<tr><td colspan="8"><div class="empty">该分组下暂无规则</div></td></tr>';

  var condHtml = g.fallback
    ? '<div class="small">兜底分组：当所有普通分组均未命中时，自动执行此分组下的规则</div>'
    : '<div class="small">' + esc(condText(groupConds[g.id])) + "</div>";

  $("pageDetail").innerHTML =
    '<div class="row mb16">' +
      '<button class="btn" onclick="go(\'rule\')">← 返回分组列表</button>' +
      '<span style="font-size:18px;font-weight:600">' + esc(g.name) + "</span>" +
      (g.fallback
        ? '<span class="tag orange">全局兜底</span>'
        : '<span class="tag ' + (isControl(g.splitId) ? "blue" : "gray") + '">所属分流组：' + esc(groupName(g.splitId)) + "</span>") +
      (g.status ? '<span class="tag green">已启用</span>' : '<span class="tag gray">已禁用</span>') +
    "</div>" +

    '<div class="card" style="background:#fffbe6;border:1px solid #ffe58f">' +
      '<div class="mb8" style="font-weight:500">' + (g.fallback ? "兜底说明" : "命中条件") + "</div>" +
      condHtml +
    "</div>" +

    '<div class="card">' +
      '<div class="row mb16">' +
        '<button class="btn primary">+ 新建规则</button>' +
        '<span class="muted small">复制规则可把已验证的规则搬到其他分流组，复制出的规则为禁用状态</span>' +
      "</div>" +
      "<table><thead><tr>" +
        "<th>规则ID</th><th>规则名称</th><th>触发类型</th><th>动作类型</th>" +
        "<th>更新时间</th><th>最后更新人</th><th>启用状态</th><th style=\"width:180px\">操作</th>" +
      "</tr></thead><tbody>" + rowsHtml + "</tbody></table>" +
    "</div>";
}

/* ---------- 复制规则弹窗 ---------- */
function openCopyRuleDialog(ruleId) {
  var srcGroup = findRuleGroup(currentGroupId);
  var list = rules[currentGroupId] || [];
  var src = null;
  for (var i = 0; i < list.length; i++) if (list[i].id === ruleId) src = list[i];

  var defSplit = srcGroup.fallback
    ? (controlGroup() ? controlGroup().id : "")
    : srcGroup.splitId;

  var opts = "";
  splitGroups.forEach(function (s) {
    opts += '<option value="' + s.id + '"' + (String(defSplit) === String(s.id) ? " selected" : "") + ">" +
      esc(s.name) + (s.type === "control" ? "（对照组）" : "") + "</option>";
  });

  openDialog(
    '<div class="dialog">' +
      '<div class="dlg-head">复制规则<button class="dlg-close" onclick="closeDialog()">&times;</button></div>' +
      '<div class="dlg-body">' +
        '<div class="alert info mb16">复制自规则「' + esc(src.name) + "」，来源分组「" + esc(srcGroup.name) + "」</div>" +

        '<div class="form-item"><div class="form-label"><span class="req">*</span>目标分流组</div><div class="form-ctl">' +
          '<select id="crSplit" style="width:100%" onchange="onCopyRuleSplitChange()">' + opts + "</select>" +
        "</div></div>" +

        '<div class="form-item"><div class="form-label"><span class="req">*</span>目标规则分组</div><div class="form-ctl">' +
          '<select id="crGroup" style="width:100%"></select>' +
          '<div class="hint" id="crGroupHint"></div>' +
        "</div></div>" +

        '<div class="form-item"><div class="form-label"><span class="req">*</span>规则名称</div><div class="form-ctl">' +
          '<input type="text" id="crName" style="width:100%" value="' + esc(src.name) + '-副本" />' +
        "</div></div>" +

        '<div class="alert warn">复制出的规则为已禁用状态，确认无误后请手动启用。复制内容包含规则描述、触发条件、时间配置与全部动作配置。</div>' +
      "</div>" +
      '<div class="dlg-foot">' +
        '<button class="btn" onclick="closeDialog()">取消</button>' +
        '<button class="btn primary" onclick="submitCopyRule(' + ruleId + ')">确认</button>' +
      "</div>" +
    "</div>"
  );
  onCopyRuleSplitChange();
}

function onCopyRuleSplitChange() {
  var splitId = Number($("crSplit").value);
  var groups = ruleGroupsOf(splitId);
  var sel = $("crGroup");
  var html = "";
  groups.forEach(function (g) {
    html += '<option value="' + g.id + '"' + (g.id === currentGroupId ? " selected" : "") + ">" +
      esc(g.name) + "（现有 " + g.ruleCount + " 条规则）</option>";
  });
  html += '<option value="0">系统兜底分组（现有 ' + (rules[0] || []).length + " 条规则）</option>";
  sel.innerHTML = html;

  $("crGroupHint").innerHTML = groups.length === 0
    ? '<span style="color:#e6a23c">该分流组下暂无规则分组，可先复制一个分组</span>'
    : "可选项为该分流组名下的全部规则分组，另含全局兜底分组";
}

function submitCopyRule(ruleId) {
  var targetGroupId = Number($("crGroup").value);
  var name = $("crName").value.trim();
  if (!name) { toast("请先选择目标规则分组并填写规则名称", "err"); return; }

  var list = rules[currentGroupId] || [];
  var src = null;
  for (var i = 0; i < list.length; i++) if (list[i].id === ruleId) src = list[i];

  var copy = JSON.parse(JSON.stringify(src));
  copy.id = src.id + 4000;
  copy.name = name;
  copy.status = 0;
  copy.updated = "2026-08-24 16:20";
  copy.operator = "朱胜武";

  if (!rules[targetGroupId]) rules[targetGroupId] = [];
  rules[targetGroupId].push(copy);
  var tg = findRuleGroup(targetGroupId);
  if (tg) tg.ruleCount = rules[targetGroupId].length;

  closeDialog();

  if (targetGroupId === currentGroupId) {
    renderDetail();
    toast("复制成功，新规则为禁用状态");
  } else {
    toast("复制成功，新规则为禁用状态", "", "查看目标分组", function () { go("detail", targetGroupId); });
  }
}

/* 初始化 */
go("split");
